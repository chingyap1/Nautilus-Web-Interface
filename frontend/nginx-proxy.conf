# Frontend nginx reverse-proxy for NWI (Nautilus-Web-Interface) stack.
# Serves the React SPA and proxies /api, /ws, and admin endpoints to backend services.
# This replaces the old static-only config that could not reach FastAPI.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── React SPA (static files) ───────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy (FastAPI on port 8000 — same network) ────────
    location /api/ {
        proxy_pass         http://nwi-backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket endpoint (FastAPI on port 8000) ─────────────────────
    location /ws {
        proxy_pass         http://nwi-backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Health check (FastAPI on port 8000) ────────────────────────────
    location /health {
        proxy_pass http://nwi-backend:8000/health;
    }

    # ── API docs (Swagger / ReDoc) ─────────────────────────────────────
    location ~* /(docs|redoc|openapi\.json)$ {
        proxy_pass http://nwi-backend:8000$uri;
    }

    # ── Admin DB API (internal service on port 8001) ───────────────────
    location /admin-api/ {
        proxy_pass         http://admin-db-api:8001/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Admin panel SPA (served by admin-db-api) ───────────────────────
    location /admin {
        proxy_pass         http://admin-db-api:8001/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}